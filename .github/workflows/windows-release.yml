name: Windows download

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Godot 4.4.1 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" \
            "$base/Godot_v4.4.1-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/templates.tpz" \
            "$base/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          chmod +x "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --version

      - name: Import and export Windows game
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64"
          mkdir -p builds/windows dist
          "$godot" --headless --path . --import
          "$godot" --headless --path . --export-release Windows \
            builds/windows/MarbleOverdrive.exe
          test -s builds/windows/MarbleOverdrive.exe
          test -s builds/windows/MarbleOverdrive.pck

      - name: Package and inspect download
        shell: bash
        run: |
          set -euo pipefail
          zip -9 -j dist/MarbleOverdrive-Windows.zip \
            builds/windows/MarbleOverdrive.exe \
            builds/windows/MarbleOverdrive.pck
          unzip -t dist/MarbleOverdrive-Windows.zip
          sha256sum dist/MarbleOverdrive-Windows.zip
          du -h dist/MarbleOverdrive-Windows.zip

      - name: Keep ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarbleOverdrive-Windows
          path: dist/MarbleOverdrive-Windows.zip
          if-no-files-found: error

      - name: Publish ZIP on tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/MarbleOverdrive-Windows.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/MarbleOverdrive-Windows.zip \
              --verify-tag --title "Marble Overdrive $GITHUB_REF_NAME" --generate-notes
          fi
    permissions:
      contents: write
